name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static website
        run: |
          mkdir _site
          cp index.html writing.html research.html tools.html podcasts.html off-the-clock.html robots.txt sitemap.xml .nojekyll _site/
          cp -R assets _site/assets
      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
